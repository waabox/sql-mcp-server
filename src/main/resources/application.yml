# SQL MCP Server Configuration

spring:
  application:
    name: sql-mcp-server
  main:
    banner-mode: off
    log-startup-info: false

  # Disable auto-configuration for DataSource (we manage connections manually)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# SQL MCP Server Configuration
sql-mcp:
  # Transport mode: 'http' (default) for server deployment, 'stdio' when
  # Claude Code starts the server locally as a subprocess
  transport: http

  # Connection profiles
  # Example configuration (override in application-local.yml or environment variables):
  # connections:
  #   - name: "local-postgres"
  #     type: POSTGRESQL
  #     host: "localhost"
  #     port: 5432
  #     database: "mydb"
  #     username: "${DB_USER}"
  #     password: "${DB_PASS}"
  #     schema: "public"
  #     read-only: true
  connections: []

  # Query execution settings
  query:
    default-timeout-ms: 30000
    # Upper bound for the per-call timeout; also applied as the server-side statement timeout
    max-timeout-ms: 120000
    # Maximum time a query may wait for a lock before failing
    lock-timeout-ms: 5000
    default-row-limit: 1000
    max-row-limit: 10000

  # Table access control. Patterns support '*'; a pattern without a dot matches
  # the bare table name in any schema, e.g. "credentials" or "secret.*".
  # System catalogs (pg_stat_activity, pg_locks, information_schema, ...) are
  # allowed by default because they are essential for debugging.
  tables:
    allow-list: []
    deny-list: []

  # HTTP transport only: when set, every request (except /health) must send
  # "Authorization: Bearer <token>". Leaving it empty runs the server unauthenticated.
  http:
    auth-token: ${SQL_MCP_AUTH_TOKEN:}

  # HTTP transport only: optional Google login. When disabled (default) the
  # server behaves as described above. When enabled, people log in with their
  # Google account (the server is the OAuth authorization server for MCP
  # clients) and the "access" mapping below decides which connections they may
  # use. The shared auth-token keeps working alongside it when set.
  auth:
    # Public base URL of this server, e.g. https://sql-mcp.example.com
    issuer: ${SQL_MCP_PUBLIC_URL:}
    # Secret shared by all replicas to encrypt tokens (at least 32 bytes).
    # Rotating it logs everyone out.
    signing-key: ${SQL_MCP_SIGNING_KEY:}
    access-token-ttl: 1h
    # Sliding: every refresh issues a new refresh token with a fresh lifetime
    refresh-token-ttl: 30d
    google:
      enabled: false
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Accepted Google Workspace domains (hosted domain claim). Empty rejects every login.
      allowed-domains: []
      # Service account key (JSON content) with domain-wide delegation, used to read groups.
      # Only required when an access entry uses "group".
      service-account-key: ${GOOGLE_SA_KEY:}
      # Workspace admin the service account impersonates
      admin-email: ${GOOGLE_ADMIN_EMAIL:}
      # How long a person's groups are cached; group or suspension changes apply after this
      groups-cache-ttl: 5m
      # Endpoints, overridable for tests
      authorize-url: https://accounts.google.com/o/oauth2/v2/auth
      token-url: https://oauth2.googleapis.com/token
      directory-url: https://admin.googleapis.com

  # Which connections each person may use (Google login only). An entry has
  # exactly one of "users" (explicit emails, no Google groups or service account
  # needed) or "group" (Google group, needs service-account-key and admin-email).
  # "*" means every connection. A person gets the union of all matching entries.
  # access:
  #   - users: [ana@example.com, pedro@example.com]
  #     connections: [analytics]
  #   - group: data@example.com
  #     connections: [analytics, prod-replica]
  #   - group: sre@example.com
  #     connections: ["*"]
  access: []

# Server configuration (for HTTP transport mode)
server:
  # Port defaults: 8080 with the http transport; random (0) with stdio, where
  # only /health is served and every Claude session runs its own process.
  # Setting server.port / SERVER_PORT explicitly overrides both.
  # On SIGTERM, stop accepting requests and let in-flight queries finish
  shutdown: graceful

# Logging configuration
logging:
  level:
    root: WARN
    co.fanki.sqlmcp: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
