# SQL MCP Server Configuration

spring:
  application:
    name: sql-mcp-server
  main:
    banner-mode: off
    log-startup-info: false

  # Disable auto-configuration for DataSource (we manage connections manually)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# SQL MCP Server Configuration
sql-mcp:
  # Transport mode: 'stdio' (default) for CLI, 'http' for server deployment
  transport: stdio

  # Connection profiles
  # Example configuration (override in application-local.yml or environment variables):
  # connections:
  #   - name: "local-postgres"
  #     type: POSTGRESQL
  #     host: "localhost"
  #     port: 5432
  #     database: "mydb"
  #     username: "${DB_USER}"
  #     password: "${DB_PASS}"
  #     schema: "public"
  #     read-only: true
  connections: []

  # Query execution settings
  query:
    default-timeout-ms: 30000
    # Upper bound for the per-call timeout; also applied as the server-side statement timeout
    max-timeout-ms: 120000
    # Maximum time a query may wait for a lock before failing
    lock-timeout-ms: 5000
    default-row-limit: 1000
    max-row-limit: 10000

  # Table access control. Patterns support '*'; a pattern without a dot matches
  # the bare table name in any schema, e.g. "credentials" or "secret.*".
  # System catalogs (pg_stat_activity, pg_locks, information_schema, ...) are
  # allowed by default because they are essential for debugging.
  tables:
    allow-list: []
    deny-list: []

  # HTTP transport only: when set, every request (except /health) must send
  # "Authorization: Bearer <token>". Leaving it empty runs the server unauthenticated.
  http:
    auth-token: ${SQL_MCP_AUTH_TOKEN:}

# Server configuration (for HTTP transport mode)
server:
  port: 8080

# Logging configuration
logging:
  level:
    root: WARN
    co.fanki.sqlmcp: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
