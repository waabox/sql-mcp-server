# GitLab CI/CD Pipeline for SQL MCP Server
# @author waabox(emiliano[at]fanki[dot]co)

stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -q"

# Cache Maven dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

# =============================================================================
# Build Stage
# =============================================================================

build:
  stage: build
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - apk add --no-cache maven
  script:
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - target/classes
    expire_in: 1 hour

# =============================================================================
# Test Stage
# =============================================================================

test:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  before_script:
    - apk add --no-cache maven docker-cli
  script:
    # Package first (tests need the JAR)
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    # Run tests
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    paths:
      - target/surefire-reports
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 7 days
  dependencies:
    - build

# =============================================================================
# Package Stage
# =============================================================================

package:
  stage: package
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - apk add --no-cache maven
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/sql-mcp-server-*.jar
    exclude:
      - target/sql-mcp-server-*-sources.jar
    expire_in: 30 days
  dependencies:
    - test
  only:
    - main
    - tags

# =============================================================================
# Docker Build (optional, for tagged releases)
# =============================================================================

docker:
  stage: package
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - |
      if [ "$CI_COMMIT_TAG" != "" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  dependencies:
    - test
  only:
    - tags
  when: manual
